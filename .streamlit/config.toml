# Tema escuro do PromoTracker (paleta grafite + detalhes em índigo/violeta).
# Valores usados pelo Streamlit quando o usuário não altera o tema manualmente.
[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b24"
textColor = "#e6e9ef"
font = "sans serif"
